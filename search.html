---
layout: default
clippy_help: It looks like you're trying to find something. Type it in the box and I'll pretend to help.
---

<div class="container-fluid index">
  <div class="row index all-posts">

    <h1 class="header author-header">Search</h1>

    <div id="search-container">
      <input type="text" id="search-input" placeholder="Type here...">
      <div class="col-md-12 content-panel articles">
        <ul id="results-container"><small>Start typing to see some results</small></ul>
      </div>
    </div>

  </div>
</div>

<hr class="search-hr" />

<script src="{{ site.baseurl }}/js/jekyll-search.js" type="text/javascript"></script>

<script type="text/javascript">
  (function () {
    var input = document.getElementById('search-input');
    var dataUrl = '{{ site.baseurl }}/search.json';
    // /search?q=... (the Office Assistant's search box) runs that search straight away
    var query = new URLSearchParams(window.location.search).get('q');

    function init (dataSource) {
      SimpleJekyllSearch.init({
        searchInput: input,
        resultsContainer: document.getElementById('results-container'),
        dataSource: dataSource,
        searchResultTemplate: '<li><a href="{url}" title="{desc}">{title}<\/a><\/li>',
        noResultsText: 'No results found',
        limit: 10,
        fuzzy: true,
      });
      if (query) {
        input.value = query;
        input.dispatchEvent(new KeyboardEvent('keyup'));
      }
    }

    if (!query) {
      init(dataUrl);
      return;
    }
    // with a URL the search box isn't wired up until the data arrives, so fetch it first
    fetch(dataUrl)
      .then(function (response) { return response.json(); })
      .then(init, function () { init(dataUrl); });
  })();
</script>
