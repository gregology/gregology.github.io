{%- comment -%} Site search box and results, used by search.html and posts.html {%- endcomment -%}
{%- assign search_version = site.time | date: '%s' -%}
<div id="search-container" class="site-search">
  <input type="search" id="search-input" class="site-search-input" placeholder="Type here..." aria-label="Search posts, pages and links" autocomplete="off" spellcheck="false">
  <p id="search-status" class="site-search-status" aria-live="polite">Start typing to see some results</p>
  <ol id="results-container" class="site-search-results"></ol>
</div>

<script src="{{ '/js/minisearch.min.js' | relative_url }}?v={{ search_version }}"></script>
<script src="{{ '/js/site-search.js' | relative_url }}?v={{ search_version }}" data-index="{{ '/search.json' | relative_url }}?v={{ search_version }}"></script>
