<p class="links">
  {% if site.author.twitter %}<a href="https://www.twitter.com/{{ site.author.twitter }}" target="_new">{% include icon.html name="twitter" %}</a>{% endif %}
  {% if site.author.facebook %}<a href="https://facebook.com/{{ site.author.facebook }}" target="_new">{% include icon.html name="facebook" %}</a>{% endif %}
  {% if site.linkedin_link %}<a href="https://ca.linkedin.com/in/{{ site.author.linkedin }}" target="_new">{% include icon.html name="linkedin" %}</a>{% endif %}
</p>
